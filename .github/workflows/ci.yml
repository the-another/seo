name: CI

# PR gate. All five jobs run the same scripts/setup/* + scripts/tests/*
# scripts the local Docker flow uses — no make, no Docker in CI (see
# docs/superpowers/specs/2026-07-04-cicd-pipeline-design.md).
# depot-ubuntu-24.04-4 (not a -latest label): PHP 8.3 is the 24.04 image's
# native series and scripts/setup/unit.sh hard-fails on any other PHP, so
# the OS release stays pinned. The -4 suffix is 4 vCPU — GitHub's standard
# runner size — because the e2e and Plugin Check jobs boot `wp server` with
# PHP_CLI_SERVER_WORKERS=6 alongside Chromium. Bump this label and the
# Docker base images in tests/*/Dockerfile together, deliberately.

on:
  pull_request:
    branches:
      - master
      - main
      - 'release/**'
      # Stacked PRs (feature branch based on another feature branch) gate too.
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHPCS
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # The runner image ships Node < 24, which would send scripts/setup/*.sh
      # down their NodeSource fallback — and deb.nodesource.com/setup_24.x now
      # returns 403. Providing Node here means that fallback is never reached.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Set up toolchain
        run: sh scripts/setup/unit.sh

      - name: Run PHPCS
        run: sh scripts/tests/lint.sh

  unit:
    name: PHPUnit
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # The runner image ships Node < 24, which would send scripts/setup/*.sh
      # down their NodeSource fallback — and deb.nodesource.com/setup_24.x now
      # returns 403. Providing Node here means that fallback is never reached.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Set up toolchain
        run: sh scripts/setup/unit.sh

      - name: Run PHPUnit
        run: sh scripts/tests/unit.sh

  test-e2e:
    name: Functional E2E
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # The runner image ships Node < 24, which would send scripts/setup/*.sh
      # down their NodeSource fallback — and deb.nodesource.com/setup_24.x now
      # returns 403. Providing Node here means that fallback is never reached.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Set up e2e environment
        run: sh scripts/setup/e2e.sh

      - name: Run functional e2e suite
        run: sh scripts/tests/e2e.sh

      - name: Upload e2e video, traces, and tour screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report-functional
          path: |
            test-results/
            artifacts/tour/
          retention-days: 7

  test-js:
    name: JS Unit
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # The runner image ships Node < 24, which would send scripts/setup/*.sh
      # down their NodeSource fallback — and deb.nodesource.com/setup_24.x now
      # returns 403. Providing Node here means that fallback is never reached.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Set up toolchain
        run: sh scripts/setup/unit.sh

      - name: Run Jest
        run: npm ci && npm run test:unit:js

  # Runs Plugin Check natively via wp-cli (no browser, no Playwright) —
  # all checks, including the 5 runtime ones. See the check-plugin suite's
  # early-init canary in tests/e2e/check-plugin/run-plugin-check.mjs.
  check-plugin:
    name: Plugin Check (PCP)
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # The runner image ships Node < 24, which would send scripts/setup/*.sh
      # down their NodeSource fallback — and deb.nodesource.com/setup_24.x now
      # returns 403. Providing Node here means that fallback is never reached.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Set up e2e environment
        run: sh scripts/setup/e2e.sh

      - name: Run Plugin Check suite
        run: sh scripts/tests/plugin-check.sh

      - name: Upload Plugin Check results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: plugin-check-results
          path: build/plugin-check-results.txt
          retention-days: 7
