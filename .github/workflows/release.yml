name: Release Plugin

# On every push to master: re-run the FULL gate (PHPCS, PHPUnit, JS unit,
# functional e2e, Plugin Check — the same five jobs, same scripts, same
# runner label as ci.yml), then build the release zip, tag v<version> (from
# package.json), and publish a GitHub Release with the zip attached. Pushing
# without a version bump is a no-op publish: the full gate still runs, but
# the existing-tag check skips the release steps with a warning.
#
# The gate here must stay identical to ci.yml's — a job added there and not
# here means a regression can reach a published release through a direct
# master push. See ci.yml's header for the runner-label rationale.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases so two rapid master pushes can't race the tag push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: PHPCS
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # The runner image ships Node < 24, which would send scripts/setup/*.sh
      # down their NodeSource fallback — and deb.nodesource.com/setup_24.x now
      # returns 403. Providing Node here means that fallback is never reached.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Set up toolchain
        run: sh scripts/setup/unit.sh

      - name: Run PHPCS
        run: sh scripts/tests/lint.sh

  unit:
    name: PHPUnit
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # The runner image ships Node < 24, which would send scripts/setup/*.sh
      # down their NodeSource fallback — and deb.nodesource.com/setup_24.x now
      # returns 403. Providing Node here means that fallback is never reached.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Set up toolchain
        run: sh scripts/setup/unit.sh

      - name: Run PHPUnit
        run: sh scripts/tests/unit.sh

  test-e2e:
    name: Functional E2E
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # The runner image ships Node < 24, which would send scripts/setup/*.sh
      # down their NodeSource fallback — and deb.nodesource.com/setup_24.x now
      # returns 403. Providing Node here means that fallback is never reached.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Set up e2e environment
        run: sh scripts/setup/e2e.sh

      - name: Run functional e2e suite
        run: sh scripts/tests/e2e.sh

      # The Playwright config reports to stdout ('list') and writes failure
      # artifacts to test-results/ — there is no playwright-report/ directory.
      - name: Upload e2e video, traces, and tour screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report-functional
          path: |
            test-results/
            artifacts/tour/
          retention-days: 7

  test-js:
    name: JS Unit
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # The runner image ships Node < 24, which would send scripts/setup/*.sh
      # down their NodeSource fallback — and deb.nodesource.com/setup_24.x now
      # returns 403. Providing Node here means that fallback is never reached.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Set up toolchain
        run: sh scripts/setup/unit.sh

      - name: Run Jest
        run: npm ci && npm run test:unit:js

  check-plugin:
    name: Plugin Check (PCP)
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # The runner image ships Node < 24, which would send scripts/setup/*.sh
      # down their NodeSource fallback — and deb.nodesource.com/setup_24.x now
      # returns 403. Providing Node here means that fallback is never reached.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Set up e2e environment
        run: sh scripts/setup/e2e.sh

      - name: Run Plugin Check suite
        run: sh scripts/tests/plugin-check.sh

      - name: Upload Plugin Check results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: plugin-check-results
          path: build/plugin-check-results.txt
          retention-days: 7

  release:
    name: Build & Release
    runs-on: depot-ubuntu-24.04-4
    needs: [lint, unit, test-e2e, test-js, check-plugin]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::warning::Tag $TAG already exists — skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # The runner image ships Node < 24, which would send scripts/setup/*.sh
      # down their NodeSource fallback — and deb.nodesource.com/setup_24.x now
      # returns 403. Providing Node here means that fallback is never reached.
      - name: Set up Node
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Set up toolchain
        if: steps.tag_check.outputs.exists == 'false'
        run: sh scripts/setup/unit.sh

      - name: Build release zip
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          npm ci --no-audit --no-fund
          npm run plugin-zip

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: build/the-another-seo-${{ steps.version.outputs.version }}.zip
